name: Action for release
description: Action for release

inputs:
  githubToken:
    description: GitHub token
    required: true

  mode:
    description: Increment mode
    required: false

outputs:
  released:
    description: was the version updated
    value: ${{ steps.output.outputs.released }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.githubToken }}
        ref: ${{ inputs.ref || github.ref }}
        fetch-depth: 0
    - uses: KimAlexander/action-bump/actions/read-package-json@develop
      id: info
    - shell: bash
      name: Create feature/bump_ver
      run: |
        base=${{ steps.info.outputs.base }}
        git fetch origin origin/$base
        git push origin --delete feature/bump_ver || true
        git switch --no-track -c feature/bump_ver "origin/$base"
        git push --set-upstream origin feature/bump_ver
    - uses: KimAlexander/action-bump/actions/setup-git@develop
      with:
        token: ${{ inputs.githubToken }}
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: npm ci
    - shell: bash
      id: output
      run: |
        npx release-it ${{ inputs.mode }} --ci
