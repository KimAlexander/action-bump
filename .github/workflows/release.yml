name: ⚠️ Bump ver
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Bump version as requested
        required: false
        default: minor
        options:
          - patch
          - minor
          - major

jobs:
  run-release:
    name: Release
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - name: Check PAT
        env:
          PAT: ${{ secrets.PAT_FOR_BOT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "PAT_FOR_BOT is EMPTY"
            exit 1
          else
            echo "PAT_FOR_BOT is available"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: KimAlexander/action-bump/actions/release-it@main # main
        id: release-it
        with:
          mode: ${{ github.event.inputs.mode || 'minor' }}
          githubToken: ${{ secrets.PAT_FOR_BOT }}
      - name: Log release outputs
        run: |
          echo "Version: v${{ steps.info.outputs.version }}"
          echo "Name: ${{ steps.info.outputs.name }}"
      - name: Create PR from dev to main
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_BOT }}

        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "Merge dev into main" \
            --body "Automated PR created by GitHub Actions."

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
